<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Maintenance — Login</title>
  <link rel="icon" href="/assets/cdn-favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #285484;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 8px;
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: #285484;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error-banner.visible { display: block; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      text-align: left;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="password"]:focus {
      border-color: #285484;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background-color: #285484;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: #1e3f63;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/cdn-logo.png" alt="CDN Homes" class="logo" />
    <div class="app-name">Maintenance Portal</div>

    <h1>Welcome back</h1>
    <p class="subtitle">Enter the team password to continue</p>

    <div class="error-banner" id="errorBanner">
      Incorrect password. Please try again.
    </div>

    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter team password"
        autofocus
        required
      />
      <button type="submit">Sign In →</button>
    </form>

    <p class="footer-note">CDN Homes internal use only</p>
  </div>

  <script>
    // Show error message if ?error=1 is in the URL
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorBanner').classList.add('visible');
    }
  </script>
</body>
</html>
